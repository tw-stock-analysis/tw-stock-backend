name: tw-stock-prod

x-backend-deploy: &backend-deploy
  image: ${BACKEND_IMAGE:?Set the verified backend GHCR digest reference}
  env_file:
    - ${DEPLOY_ENV_FILE:-.env.production}
  environment:
    APP_ENV: production
    DATABASE_URL: ""
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?Set explicit HTTPS browser origins}
  init: true

services:
  web:
    image: ${FRONTEND_IMAGE:?Set the verified frontend GHCR digest reference}
    environment:
      SITE_HOST: ${SITE_HOST:?Set the HTTPS website hostname}
      WEB_HTTPS_PORT: ${WEB_HTTPS_PORT:-443}
      NGINX_ENVSUBST_FILTER: "^(SITE_HOST|WEB_HTTPS_PORT)$"
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_HTTP_PORT:-80}:80"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:?Set the TLS certificate directory}:/etc/nginx/tls:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  backend:
    <<: *backend-deploy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import ProxyHandler, build_opener; build_opener(ProxyHandler({})).open('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *backend-deploy
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twstock_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the production PostgreSQL password}
      POSTGRES_DB: ${POSTGRES_DB:-twstock_prod}
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 12
    restart: unless-stopped

volumes:
  production_postgres_data:
